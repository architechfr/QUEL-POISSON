<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reconnaissance — poissons d'eau douce · Module 1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --eau:#0B2426;
  --eau-2:#102F32;
  --carte:#143a3d;
  --limon:#C9B98C;
  --limon-faible:rgba(201,185,140,.22);
  --ecaille:#EBF1ED;
  --flanc:#6FD3BE;
  --alerte:#E1553C;
  --r:14px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--eau);
  background-image:linear-gradient(180deg,#0E2E31 0%,#0B2426 55%,#081C1E 100%);
  background-attachment:fixed;
  color:var(--ecaille);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding:24px 18px 64px;
}

.wrap{max-width:560px;margin:0 auto}

/* ---------- en-tête ---------- */
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--limon);margin-bottom:10px;
}
h1{
  font-family:'Bricolage Grotesque','Inter',sans-serif;
  font-weight:800;font-size:clamp(30px,8vw,42px);
  line-height:.98;letter-spacing:-.025em;margin-bottom:10px;
}
h1 em{font-style:normal;color:var(--flanc)}
.chapeau{color:rgba(235,241,237,.62);font-size:14.5px;line-height:1.5;max-width:44ch}

/* ---------- zone photo ---------- */
.capture{
  margin-top:26px;border:1.5px dashed var(--limon-faible);
  border-radius:var(--r);background:rgba(255,255,255,.025);
  padding:34px 20px;text-align:center;cursor:pointer;
  transition:border-color .18s,background .18s;
  display:block;width:100%;color:inherit;font:inherit;
}
.capture:hover,.capture:focus-visible{border-color:var(--flanc);background:rgba(111,211,190,.06)}
.capture:focus-visible{outline:2px solid var(--flanc);outline-offset:3px}
.capture-t{font-weight:600;font-size:16px;margin-bottom:5px}
.capture-s{font-size:13px;color:rgba(235,241,237,.5)}
.hameçon{font-size:26px;display:block;margin-bottom:12px;opacity:.75}

.apercu{margin-top:26px;border-radius:var(--r);overflow:hidden;position:relative;background:#000}
.apercu img{width:100%;display:block;max-height:340px;object-fit:cover}
.apercu-actions{display:flex;gap:10px;margin-top:12px}

button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn-primaire{
  flex:1;background:var(--flanc);color:#062022;font-weight:600;
  padding:15px 18px;font-size:15.5px;letter-spacing:-.01em;
  transition:filter .15s,transform .1s;
}
.btn-primaire:hover{filter:brightness(1.08)}
.btn-primaire:active{transform:translateY(1px)}
.btn-primaire:disabled{opacity:.45;cursor:wait}
.btn-secondaire{
  background:transparent;color:var(--limon);border:1px solid var(--limon-faible);
  padding:15px 18px;font-size:14.5px;
}
.btn-secondaire:hover{border-color:var(--limon)}
button:focus-visible{outline:2px solid var(--flanc);outline-offset:2px}

/* ---------- résultat ---------- */
.res{margin-top:30px}
.carte{
  background:var(--carte);border:1px solid var(--limon-faible);
  border-radius:var(--r);padding:22px;margin-bottom:14px;
}
.espece{
  font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;
  font-size:clamp(26px,7vw,34px);line-height:1;letter-spacing:-.02em;
}
.sci{font-style:italic;color:var(--limon);font-size:14px;margin-top:6px}

.conf{margin-top:18px}
.conf-l{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(235,241,237,.55);
  margin-bottom:7px;
}
.conf-v{color:var(--ecaille);font-size:13px}
.conf-piste{height:5px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.conf-barre{height:100%;background:var(--flanc);border-radius:99px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.conf-barre.mediocre{background:var(--limon)}
.conf-barre.faible{background:var(--alerte)}

/* ---------- la règle graduée (élément signature) ---------- */
.titre-bloc{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--limon);margin-bottom:16px;
}
.regle{position:relative;padding-top:34px;padding-bottom:30px;margin-top:4px}
.regle-piste{position:relative;height:38px;background:rgba(0,0,0,.22);border-radius:6px;overflow:hidden}
.zone-interdite{position:absolute;top:0;bottom:0;left:0;background:rgba(225,85,60,.17)}
.trait{position:absolute;top:0;bottom:0;width:1px;background:var(--limon-faible)}
.trait.majeur{background:rgba(201,185,140,.5)}
.grad{
  position:absolute;bottom:-24px;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(235,241,237,.42);
}
.maille-ligne{position:absolute;top:-6px;bottom:-6px;width:2.5px;background:var(--alerte);border-radius:2px}
.maille-etiq{
  position:absolute;top:-30px;transform:translateX(-50%);white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
  color:var(--alerte);letter-spacing:.05em;
}
.marqueur{
  position:absolute;top:-9px;bottom:-9px;width:3px;background:var(--ecaille);
  border-radius:2px;left:0;transition:left 1s cubic-bezier(.2,.85,.25,1);
}
.marqueur::after{
  content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:7px solid var(--ecaille);
}
.taille-etiq{
  position:absolute;top:-30px;transform:translateX(-50%);white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  transition:left 1s cubic-bezier(.2,.85,.25,1);
}

.verdict{
  margin-top:26px;padding:16px 18px;border-radius:10px;
  font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;
  font-size:19px;letter-spacing:-.01em;line-height:1.15;
  opacity:0;animation:monte .45s .55s forwards;
}
@keyframes monte{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.verdict.remettre{background:rgba(225,85,60,.14);border:1px solid rgba(225,85,60,.42);color:#FF8B72}
.verdict.garder{background:rgba(111,211,190,.12);border:1px solid rgba(111,211,190,.4);color:var(--flanc)}
.verdict.mesurer{background:rgba(201,185,140,.11);border:1px solid var(--limon-faible);color:var(--limon)}
.verdict small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:13.5px;
  margin-top:7px;opacity:.82;letter-spacing:0;line-height:1.45}

.mesure-manuelle{margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mesure-manuelle label{font-size:13px;color:rgba(235,241,237,.6)}
input[type=number]{
  font-family:'JetBrains Mono',monospace;font-size:15px;width:92px;
  background:rgba(0,0,0,.25);border:1px solid var(--limon-faible);
  color:var(--ecaille);border-radius:8px;padding:9px 11px;
}
input[type=number]:focus{outline:2px solid var(--flanc);outline-offset:1px;border-color:transparent}

/* ---------- listes ---------- */
ul{list-style:none}
.critere{
  display:flex;gap:11px;padding:9px 0;font-size:14.5px;line-height:1.45;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.critere:last-child{border-bottom:none}
.critere span:first-child{color:var(--flanc);flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;padding-top:2px}

.alt{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.alt:last-child{border-bottom:none}
.alt-n{font-weight:600}
.alt-r{color:rgba(235,241,237,.55);font-size:13px;margin-top:3px;line-height:1.4}
.alt-c{font-family:'JetBrains Mono',monospace;color:var(--limon);flex-shrink:0}

.ligne-info{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14.5px;line-height:1.5}
.ligne-info:last-child{border-bottom:none}
.ligne-info dt{color:var(--limon);flex-shrink:0;width:96px;font-size:13px}
.ligne-info dd{flex:1}

.avert{
  font-size:12.5px;line-height:1.55;color:rgba(235,241,237,.5);
  border-left:2px solid var(--limon-faible);padding-left:14px;margin-top:22px;
}
.avert strong{color:var(--limon);font-weight:600}

.erreur{
  background:rgba(225,85,60,.12);border:1px solid rgba(225,85,60,.4);
  border-radius:var(--r);padding:18px;font-size:14.5px;line-height:1.5;
}
.erreur strong{display:block;margin-bottom:5px;color:#FF8B72}

.charge{text-align:center;padding:40px 0;color:var(--limon);font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.pulse{display:inline-block;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

.cache{display:none}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .verdict{opacity:1}
}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Module 1 · itération 1</p>
  <h1>Qu'est-ce que<br>tu viens de <em>sortir&nbsp;?</em></h1>
  <p class="chapeau">Photographie ta prise : l'espèce est identifiée, la maille et la période de fermeture sont comparées à ta capture.</p>

  <input type="file" id="fichier" accept="image/*" capture="environment" class="cache">

  <button class="capture" id="zone">
    <span class="hameçon">🪝</span>
    <span class="capture-t">Prendre ou choisir une photo</span>
    <span class="capture-s">Poisson entier, de profil, avec un repère d'échelle dans le cadre</span>
  </button>

  <div id="apercu" class="cache">
    <div class="apercu"><img id="img" alt="Photo de la prise"></div>
    <div class="apercu-actions">
      <button class="btn-primaire" id="lancer">Identifier</button>
      <button class="btn-secondaire" id="reset">Autre photo</button>
    </div>
  </div>

  <div id="sortie" class="res"></div>

</div>

<script>
/* =====================================================================
   RÉFÉRENTIEL RÉGLEMENTAIRE — données maîtrisées, PAS générées par l'IA.
   L'IA identifie l'espèce ; la réglementation est lue ici.
   Valeurs nationales indicatives : l'arrêté préfectoral peut être plus
   strict. À faire valider avant tout usage réel.
   ===================================================================== */
const REFERENTIEL = {
  brochet:        {nom:"Brochet", sci:"Esox lucius", maille:60,
                   fermeture:"Pêche interdite du dernier dimanche de janvier au 30 avril inclus (2ᵉ catégorie).",
                   note:"Ouverture des carnassiers le 1ᵉʳ samedi de mai."},
  sandre:         {nom:"Sandre", sci:"Sander lucioperca", maille:40,
                   fermeture:"Fermeture carnassiers en 2ᵉ catégorie, du dernier dimanche de janvier au 30 avril.",
                   note:"Maille souvent portée à 50 cm par arrêté préfectoral."},
  black_bass:     {nom:"Black-bass", sci:"Micropterus salmoides", maille:30,
                   fermeture:"Fermeture carnassiers en 2ᵉ catégorie.",
                   note:"Remise à l'eau obligatoire jusqu'au début juillet dans de nombreux départements."},
  perche:         {nom:"Perche commune", sci:"Perca fluviatilis", maille:null,
                   fermeture:"Pêche autorisée toute l'année en 2ᵉ catégorie.", note:null},
  truite_fario:   {nom:"Truite fario", sci:"Salmo trutta fario", maille:23,
                   fermeture:"Ouverture du 2ᵉ samedi de mars au 3ᵉ dimanche de septembre.",
                   note:"Maille portée à 25 cm dans de nombreux départements."},
  truite_arc:     {nom:"Truite arc-en-ciel", sci:"Oncorhynchus mykiss", maille:null,
                   fermeture:"Mêmes périodes que la truite fario.", note:"Espèce introduite, pas de maille nationale."},
  omble_fontaine: {nom:"Omble de fontaine", sci:"Salvelinus fontinalis", maille:23,
                   fermeture:"Périodes salmonidés.", note:null},
  omble_chevalier:{nom:"Omble chevalier", sci:"Salvelinus alpinus", maille:23,
                   fermeture:"Périodes fixées localement (lacs alpins).", note:"Espèce sensible, quotas fréquents."},
  ombre:          {nom:"Ombre commun", sci:"Thymallus thymallus", maille:30,
                   fermeture:"Ouverture du 3ᵉ samedi de mai au 3ᵉ dimanche de septembre.",
                   note:"Maille portée à 35 cm dans plusieurs départements. Espèce fragile, no-kill recommandé."},
  saumon:         {nom:"Saumon atlantique", sci:"Salmo salar", maille:50,
                   fermeture:"Périodes et quotas fixés par arrêté ; TAC national.",
                   note:"Déclaration de capture obligatoire sous 48 h."},
  anguille:       {nom:"Anguille européenne", sci:"Anguilla anguilla", maille:30,
                   fermeture:"Périodes très restreintes fixées par arrêté.",
                   note:"Espèce en danger critique. Anguille argentée strictement interdite."},
  carpe:          {nom:"Carpe commune", sci:"Cyprinus carpio", maille:null,
                   fermeture:"Pêche autorisée toute l'année en 2ᵉ catégorie.",
                   note:"Transport vivante interdit au-delà de 60 cm. Pêche de nuit sur parcours autorisés uniquement."},
  tanche:         {nom:"Tanche", sci:"Tinca tinca", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  gardon:         {nom:"Gardon", sci:"Rutilus rutilus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  rotengle:       {nom:"Rotengle", sci:"Scardinius erythrophthalmus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.",
                   note:"Souvent confondu avec le gardon : bouche orientée vers le haut, nageoires rouge vif."},
  breme:          {nom:"Brème commune", sci:"Abramis brama", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  chevesne:       {nom:"Chevesne", sci:"Squalius cephalus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  barbeau:        {nom:"Barbeau fluviatile", sci:"Barbus barbus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:"Œufs toxiques à la consommation."},
  ablette:        {nom:"Ablette", sci:"Alburnus alburnus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  goujon:         {nom:"Goujon", sci:"Gobio gobio", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  hotu:           {nom:"Hotu", sci:"Chondrostoma nasus", maille:null, fermeture:"Autorisée toute l'année en 2ᵉ catégorie.", note:null},
  silure:         {nom:"Silure glane", sci:"Silurus glanis", maille:null,
                   fermeture:"Fermeture carnassiers en 2ᵉ catégorie dans la plupart des départements.",
                   note:"Statut variable : remise à l'eau parfois interdite localement."},
  poisson_chat:   {nom:"Poisson-chat", sci:"Ameiurus melas", maille:null, esod:true,
                   fermeture:"Pêche autorisée toute l'année.",
                   note:"Espèce susceptible de provoquer des déséquilibres biologiques."},
  perche_soleil:  {nom:"Perche soleil", sci:"Lepomis gibbosus", maille:null, esod:true,
                   fermeture:"Pêche autorisée toute l'année.",
                   note:"Espèce susceptible de provoquer des déséquilibres biologiques."},
  ecrevisse:      {nom:"Écrevisse (exotique)", sci:"Procambarus / Pacifastacus", maille:null, esod:true,
                   fermeture:"Selon espèce et département.",
                   note:"Les écrevisses indigènes (à pattes blanches) sont intégralement protégées."},
  autre:          {nom:"Espèce non référencée", sci:"", maille:null,
                   fermeture:"Non renseignée dans ce référentiel.", note:"Vérifier l'arrêté préfectoral."}
};

const CLES = Object.keys(REFERENTIEL).filter(k => k !== 'autre').join(', ');

/* ---------- état ---------- */
let base64 = null, dernier = null;

const $ = id => document.getElementById(id);
const fichier = $('fichier'), sortie = $('sortie');

$('zone').onclick = () => fichier.click();
$('reset').onclick = () => {
  base64 = null; dernier = null;
  fichier.value = '';
  $('apercu').classList.add('cache');
  $('zone').classList.remove('cache');
  sortie.innerHTML = '';
};

fichier.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  sortie.innerHTML = '';
  try {
    base64 = await reduire(f);
    $('img').src = 'data:image/jpeg;base64,' + base64;
    $('zone').classList.add('cache');
    $('apercu').classList.remove('cache');
  } catch {
    sortie.innerHTML = bloqueErreur("Photo illisible", "Ce fichier n'a pas pu être ouvert. Essaie une autre photo, au format JPEG ou PNG.");
  }
};

/* Réduction à 1024 px max : sans ça, une photo de téléphone dépasse
   largement la taille utile et ralentit l'appel pour rien. */
function reduire(file){
  return new Promise((ok, ko) => {
    const lect = new FileReader();
    lect.onerror = ko;
    lect.onload = () => {
      const im = new Image();
      im.onerror = ko;
      im.onload = () => {
        const max = 1024;
        const ech = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * ech);
        c.height = Math.round(im.height * ech);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', .85).split(',')[1]);
      };
      im.src = lect.result;
    };
    lect.readAsDataURL(file);
  });
}

/* ---------- appel modèle ---------- */
$('lancer').onclick = async () => {
  if (!base64) return;
  const b = $('lancer');
  b.disabled = true; b.textContent = 'Analyse…';
  sortie.innerHTML = '<div class="charge"><span class="pulse">lecture de la photo</span></div>';

  const consigne = `Tu es ichtyologue, spécialiste des poissons d'eau douce de France métropolitaine.
Analyse la photo et identifie l'espèce.

Réponds UNIQUEMENT avec un objet JSON, sans texte autour, sans balises markdown :
{
  "est_un_poisson": true | false,
  "cle": une clé parmi [${CLES}] ou "autre",
  "nom_libre": "nom courant si la clé est autre, sinon null",
  "confiance": nombre entre 0 et 1,
  "criteres": ["3 à 5 critères morphologiques RÉELLEMENT visibles sur cette photo qui justifient l'identification"],
  "alternatives": [{"nom":"...", "confiance":0.0, "raison":"ce qui permettrait de trancher"}],
  "taille_cm": nombre ou null,
  "repere_echelle": "l'objet utilisé pour estimer la taille, ou null si aucun",
  "qualite_photo": "bonne" | "moyenne" | "mauvaise",
  "remarque": "une phrase si un problème gêne l'identification, sinon null"
}

Règles strictes :
- Calibre ta confiance honnêtement. Une photo floue, un poisson partiellement caché ou une espèce sosie doivent faire chuter la confiance. Mieux vaut 0.4 juste que 0.9 faux.
- N'estime taille_cm QUE si un repère d'échelle fiable est visible (main, leurre, épuisette, règle, pièce, chaussure). Sinon mets null et repere_echelle à null. N'invente jamais une taille.
- Attention aux confusions classiques : gardon/rotengle, brochet/jeune silure, truite fario/arc-en-ciel, perche/perche soleil, brème/carpe.
- Si aucun poisson n'est visible, mets est_un_poisson à false et explique dans remarque.
- Ne donne aucune information réglementaire : maille, période, quota. Ce n'est pas ton rôle.`;

  try {
    const rep = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content:[
          {type:"image", source:{type:"base64", media_type:"image/jpeg", data:base64}},
          {type:"text", text:consigne}
        ]}]
      })
    });
    if (!rep.ok) throw new Error("http " + rep.status);
    const data = await rep.json();
    const brut = data.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
    dernier = JSON.parse(brut.replace(/```json|```/g, '').trim());
    afficher(dernier);
  } catch (err) {
    console.error(err);
    sortie.innerHTML = bloqueErreur(
      "L'analyse n'a pas abouti",
      "La photo n'a pas pu être traitée. Vérifie ta connexion et relance l'identification."
    );
  } finally {
    b.disabled = false; b.textContent = 'Identifier';
  }
};

/* ---------- rendu ---------- */
function afficher(r){
  if (!r.est_un_poisson){
    sortie.innerHTML = bloqueErreur("Aucun poisson détecté",
      (r.remarque || "Rien d'identifiable sur cette photo.") + " Cadre le poisson entier, de profil, sur fond dégagé.");
    return;
  }

  const ref = REFERENTIEL[r.cle] || REFERENTIEL.autre;
  const nom = r.cle === 'autre' ? (r.nom_libre || ref.nom) : ref.nom;
  const pc  = Math.round((r.confiance || 0) * 100);
  const cls = pc >= 75 ? '' : pc >= 45 ? 'mediocre' : 'faible';

  sortie.innerHTML = `
    <div class="carte">
      <div class="espece">${esc(nom)}</div>
      ${ref.sci ? `<div class="sci">${esc(ref.sci)}</div>` : ''}
      <div class="conf">
        <div class="conf-l"><span>Confiance de l'identification</span><span class="conf-v">${pc}&nbsp;%</span></div>
        <div class="conf-piste"><div class="conf-barre ${cls}" id="barre"></div></div>
      </div>
      ${r.remarque ? `<p style="margin-top:16px;font-size:13.5px;color:var(--limon);line-height:1.5">${esc(r.remarque)}</p>` : ''}
    </div>

    <div class="carte" id="carte-regle"></div>

    <div class="carte">
      <p class="titre-bloc">Ce qui a été observé</p>
      <ul>${(r.criteres || []).map(c => `<li class="critere"><span>—</span><span>${esc(c)}</span></li>`).join('')}</ul>
    </div>

    ${(r.alternatives && r.alternatives.length) ? `
    <div class="carte">
      <p class="titre-bloc">Si ce n'est pas ça</p>
      <ul>${r.alternatives.map(a => `
        <li class="alt">
          <div><div class="alt-n">${esc(a.nom)}</div><div class="alt-r">${esc(a.raison || '')}</div></div>
          <div class="alt-c">${Math.round((a.confiance || 0) * 100)}&nbsp;%</div>
        </li>`).join('')}</ul>
    </div>` : ''}

    <div class="carte">
      <p class="titre-bloc">Réglementation</p>
      <dl>
        <div class="ligne-info"><dt>Maille</dt><dd>${ref.maille ? ref.maille + ' cm' : 'Pas de taille légale nationale'}</dd></div>
        <div class="ligne-info"><dt>Période</dt><dd>${esc(ref.fermeture)}</dd></div>
        ${ref.note ? `<div class="ligne-info"><dt>À savoir</dt><dd>${esc(ref.note)}</dd></div>` : ''}
      </dl>
      <p class="avert"><strong>Valeurs indicatives.</strong> La réglementation est fixée par l'arrêté préfectoral de ton département et par la catégorie piscicole du cours d'eau. Elle est souvent plus stricte que le cadre national. Vérifie auprès de ta fédération de pêche avant de conserver une prise.</p>
    </div>`;

  requestAnimationFrame(() => { $('barre').style.width = pc + '%'; });
  rendreRegle(r, ref);
}

function rendreRegle(r, ref){
  const c = $('carte-regle');
  const taille = r.taille_cm;
  const maille = ref.maille;
  const haut = Math.ceil(Math.max((maille || 0) * 1.5, (taille || 0) * 1.3, 50) / 10) * 10;
  const pas = haut <= 70 ? 10 : haut <= 140 ? 20 : 25;

  let traits = '';
  for (let v = pas; v < haut; v += pas){
    const p = v / haut * 100;
    traits += `<div class="trait majeur" style="left:${p}%"></div><div class="grad" style="left:${p}%">${v}</div>`;
  }

  const posM = maille ? maille / haut * 100 : null;
  const posT = taille ? taille / haut * 100 : null;

  let verdict;
  if (ref.esod){
    verdict = `<div class="verdict remettre">Remise à l'eau interdite<small>Espèce classée susceptible de provoquer des déséquilibres biologiques : elle ne doit pas être remise vivante dans le cours d'eau.</small></div>`;
  } else if (!maille){
    verdict = `<div class="verdict garder">Pas de taille légale<small>Aucune maille nationale pour cette espèce. Le règlement local peut malgré tout en imposer une.</small></div>`;
  } else if (taille == null){
    verdict = `<div class="verdict mesurer">Mesure nécessaire<small>Aucun repère d'échelle exploitable sur la photo. Saisis la longueur mesurée du museau à la fourche de la queue.</small></div>`;
  } else if (taille < maille){
    verdict = `<div class="verdict remettre">À remettre à l'eau<small>${maille - taille} cm sous la maille de ${maille} cm. Remets-la à l'eau sans la sortir de l'épuisette si possible.</small></div>`;
  } else {
    verdict = `<div class="verdict garder">Maille atteinte<small>${taille - maille} cm au-dessus des ${maille} cm réglementaires. Le quota journalier reste à vérifier.</small></div>`;
  }

  c.innerHTML = `
    <p class="titre-bloc">Taille ${taille != null ? 'estimée' : 'non estimée'}${r.repere_echelle ? ' · repère : ' + esc(r.repere_echelle) : ''}</p>
    <div class="regle">
      <div class="regle-piste">
        ${posM != null ? `<div class="zone-interdite" style="width:${posM}%"></div>` : ''}
        ${traits}
      </div>
      ${posM != null ? `<div class="maille-ligne" style="left:${posM}%"></div><div class="maille-etiq" style="left:${posM}%">MAILLE ${maille}</div>` : ''}
      ${posT != null ? `<div class="marqueur" id="marq"></div><div class="taille-etiq" id="etiq" style="left:0">${taille} cm</div>` : ''}
      <div class="grad" style="left:0">0</div><div class="grad" style="left:100%">${haut}</div>
    </div>
    ${verdict}
    <div class="mesure-manuelle">
      <label for="saisie">Longueur mesurée</label>
      <input type="number" id="saisie" min="1" max="300" step="0.5" placeholder="cm" value="${taille != null ? taille : ''}">
      <button class="btn-secondaire" id="recalc" style="padding:9px 16px">Recalculer</button>
    </div>`;

  if (posT != null){
    requestAnimationFrame(() => {
      $('marq').style.left = posT + '%';
      $('etiq').style.left = posT + '%';
      $('etiq').style.color = (maille && taille < maille) ? 'var(--alerte)' : 'var(--flanc)';
    });
  }

  $('recalc').onclick = () => {
    const v = parseFloat($('saisie').value);
    if (!isNaN(v) && v > 0){
      dernier.taille_cm = v;
      dernier.repere_echelle = 'mesure saisie';
      rendreRegle(dernier, ref);
    }
  };
}

function bloqueErreur(t, m){
  return `<div class="erreur"><strong>${esc(t)}</strong>${esc(m)}</div>`;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
</script>
</body>
</html>
